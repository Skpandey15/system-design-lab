services:
  postgres:
    image: postgres:16-alpine
    container_name: order-platform-postgres
    environment:
      POSTGRES_DB: orderplatform
      POSTGRES_USER: orderplatform
      POSTGRES_PASSWORD: orderplatform
    ports:
      - "5432:5432"
    volumes:
      - order-platform-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderplatform -d orderplatform"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  order-platform-postgres-data:
